# ============================================================
# cloudbuild.yaml — Pipeline CI/CD com Google Cloud Build
# Agente Pessoal v3.1
# ============================================================
# Trigger: push na branch main
# ============================================================

substitutions:
  _REGION: southamerica-east1
  _REPO: agente-pessoal
  _SERVICE_ACCOUNT: agente-pessoal-sa
  _DB_INSTANCE: agente-db

steps:

  # ── 1. Testes ────────────────────────────────────────────────────────────────
  - name: python:3.11-slim
    id: testes
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt pytest &&
        mkdir -p memory &&
        DATABASE_URL=sqlite:///memory/test.db \
        OPENAI_API_KEY=sk-fake-test \
        pytest tests/ -v --tb=short
    waitFor: ["-"]

  # ── 2. Build da imagem ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - docker/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:latest
      - .
    waitFor: [testes]

  # ── 3. Push da imagem ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
    waitFor: [build]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:latest
    waitFor: [build]

  # ── 4. Deploy API REST ────────────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agente-api
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8000
      - --command=python
      - --args=api/main.py
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --service-account=$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:$_DB_INSTANCE
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --set-env-vars=PYTHONPATH=/app
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-sha]

  # ── 5. Deploy Interface Web ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-web
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agente-web
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8501
      - --command=streamlit
      - --args=run,ui/streamlit_app.py,--server.port=8501,--server.address=0.0.0.0,--server.headless=true
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --service-account=$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:$_DB_INSTANCE
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-sha]

  # ── 6. Deploy Dashboard ───────────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-dashboard
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agente-dashboard
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8502
      - --command=streamlit
      - --args=run,ui/dashboard.py,--server.port=8502,--server.address=0.0.0.0,--server.headless=true
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --service-account=$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:$_DB_INSTANCE
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-sha]

  # ── 7. Deploy WhatsApp Webhook ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-whatsapp
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agente-whatsapp
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8001
      - --command=python
      - --args=ui/bot_whatsapp.py
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --service-account=$_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:$_DB_INSTANCE
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest
      - --set-env-vars=WHATSAPP_ENABLED=true,PYTHONPATH=/app
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-sha]

# ── Imagem de build ────────────────────────────────────────────────────────────
images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/agente:latest

# ── Configurações ──────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

timeout: 1800s
