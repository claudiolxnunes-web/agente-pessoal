version: '3.8'

services:
  # API REST
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agente-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../memory:/app/memory
      - ../config:/app/config
    command: python api/main.py
    restart: unless-stopped
    networks:
      - agente-network

  # Interface Web Streamlit
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agente-web
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../memory:/app/memory
      - ../config:/app/config
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    networks:
      - agente-network

  # Dashboard Analytics
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agente-dashboard
    ports:
      - "8502:8502"
    env_file:
      - ../.env
    volumes:
      - ../memory:/app/memory
    command: streamlit run ui/dashboard.py --server.port=8502 --server.address=0.0.0.0
    restart: unless-stopped
    networks:
      - agente-network

  # Bot Telegram
  telegram:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agente-telegram
    env_file:
      - ../.env
    volumes:
      - ../memory:/app/memory
      - ../config:/app/config
    command: python ui/bot_telegram.py
    restart: unless-stopped
    networks:
      - agente-network

  # Banco de Dados PostgreSQL (opcional)
  postgres:
    image: postgres:15-alpine
    container_name: agente-postgres
    environment:
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: agente123
      POSTGRES_DB: agente
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agente-network

volumes:
  postgres-data:

networks:
  agente-network:
    driver: bridge
