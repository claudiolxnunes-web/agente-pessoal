name: CI/CD - Agente Pessoal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-dotenv sqlalchemy fastapi uvicorn pydantic requests schedule
        pip install pytest pytest-cov flake8

    - name: Lint com flake8 (erros críticos)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test com pytest
      env:
        DATABASE_URL: sqlite:///memory/agente_test.db
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy via SSH para GCP
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.DEPLOY_HOST }}
        USER: ${{ secrets.DEPLOY_USER }}
      run: |
        echo "$SSH_KEY" > deploy_key.pem
        chmod 600 deploy_key.pem
        ssh -i deploy_key.pem -o StrictHostKeyChecking=no $USER@$HOST '
          set -e
          cd ~/agente_pessoal
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt --quiet
          python -c "from database.models import init_db; init_db()"
          echo "Deploy concluido com sucesso!"
        '
